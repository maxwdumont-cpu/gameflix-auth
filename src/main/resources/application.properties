# GameFlix User Service (auth) - HCDD 412 Module 4
#
# No secrets live in this file. Every credential is an environment variable, or comes from
# application-local.properties next to the jar / in the project root (gitignored).
# See application.properties.example for the keys.
spring.application.name=gameflix-auth
spring.config.import=optional:file:./application-local.properties

# 8081 because 8080 is already taken on the dev machine; override with PORT.
server.port=${PORT:8081}

# --- MySQL ---------------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/gameflix}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# update: Hibernate creates the users table on first run and keeps the data between runs,
# so registered users survive restarts and the SELECT evidence is reproducible.
# create-drop would wipe the table every shutdown. Schema is also committed as db/schema.sql.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# --- JWT -----------------------------------------------------------------------------
# Base64 string that decodes to >= 32 bytes (HS256). Generate: openssl rand -base64 48
gameflix.jwt.secret=${GAMEFLIX_JWT_SECRET}
gameflix.jwt.issuer=gameflix-user-service
gameflix.jwt.ttl=15m

# --- CORS ----------------------------------------------------------------------------
# Exactly one front-end origin. Wildcards are rejected at startup.
gameflix.cors.allowed-origin=${GAMEFLIX_FRONTEND_ORIGIN:http://localhost:3000}

# --- Responses / logging -------------------------------------------------------------
spring.jackson.default-property-inclusion=non_null
server.error.include-message=never
server.error.include-stacktrace=never
